<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NEBULA 27 | Música del espacio exterior</title>
    <meta name="description" content="Música electrónica, atmósferas espaciales y sonidos del cosmos. Escucha lo nuevo de NEBULA 27.">
    <meta name="author" content="NEBULA 27">
    <meta property="og:title" content="NEBULA 27">
    <meta property="og:description" content="Música del espacio exterior">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0b0f1c, #03050a);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            color: #fff;
        }

        /* Contenedor principal tipo tarjeta cósmica */
        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(15, 20, 35, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            padding: 2rem 1.8rem 2.5rem;
            border: 1px solid rgba(120, 100, 220, 0.5);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(160, 120, 255, 0.2);
            transition: transform 0.2s ease;
            text-align: center;
        }

        .avatar {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #6b2de8, #b45eff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            font-size: 3.8rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.1);
            transition: 0.2s;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #bfa2ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: #c9adff;
            border-bottom: 1px dashed #6f4bcb;
            display: inline-block;
            padding-bottom: 6px;
            margin-bottom: 1.5rem;
        }

        /* Reproductor de audio minimalista */
        .player {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 60px;
            padding: 0.8rem 1.2rem;
            margin: 1.8rem 0 1.5rem;
            border: 1px solid #3f2a8c;
        }
        audio {
            width: 100%;
            border-radius: 60px;
            outline: none;
        }

        /* Grid de enlaces / redes sociales */
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin: 2rem 0;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border-radius: 80px;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: all 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-card:hover {
            background: rgba(110, 70, 220, 0.3);
            transform: translateX(8px);
            border-color: #b87aff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            font-size: 1.8rem;
            width: 45px;
            text-align: center;
        }

        .link-name {
            flex: 1;
            text-align: left;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            font-size: 1.3rem;
            opacity: 0.7;
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(95deg, #7a45e8, #b656ff);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: 0.2s;
            margin-top: 0.5rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #8b5cf3, #c46eff);
            box-shadow: 0 0 12px #a86eff;
        }

        .counter {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            margin-top: 1rem;
            backdrop-filter: blur(4px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #aaa;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
        }

        @media (max-width: 550px) {
            .container {
                padding: 1.5rem 1rem;
            }
            h1 {
                font-size: 2rem;
            }
            .link-icon {
                font-size: 1.5rem;
                width: 36px;
            }
            .link-name {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
